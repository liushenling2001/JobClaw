<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobClaw - AI Agent Console</title>
    <script type="module" crossorigin src="/assets/index-8zuR9SD0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DG_ndgyf.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const ID = "jobclaw-create-config-file";
        const MAIN_AGENT_BUTTON_ID = "jobclaw-configure-main-agent";
        const MAIN_AGENT_MODAL_ID = "jobclaw-main-agent-modal";
        const PROVIDER_DATALIST_ID = "jobclaw-provider-options";
        const MODEL_DATALIST_ID = "jobclaw-model-options";
        const CHAT_SUGGESTIONS_ID = "jobclaw-chat-suggestions";
        const CHAT_REASONING_EFFORT_ID = "jobclaw-chat-reasoning-effort";
        const CHAT_REASONING_EFFORT_STORAGE_PREFIX = "jobclaw:chat:reasoningEffort:";
        let providerOptionsPromise = null;
        let modelOptionsPromise = null;
        let mainAgentProfilePromise = null;
        let chatSuggestionsPromise = null;

        function loadProviderOptions() {
          if (!providerOptionsPromise) {
            providerOptionsPromise = fetch("/api/providers")
              .then(response => response.ok ? response.json() : [])
              .catch(() => []);
          }
          return providerOptionsPromise;
        }

        function loadModelOptions() {
          if (!modelOptionsPromise) {
            modelOptionsPromise = fetch("/api/models")
              .then(response => response.ok ? response.json() : [])
              .catch(() => []);
          }
          return modelOptionsPromise;
        }

        function loadMainAgentProfile() {
          if (!mainAgentProfilePromise) {
            mainAgentProfilePromise = fetch("/api/agents/main%3Aassistant")
              .then(response => response.ok ? response.json() : null)
              .catch(() => null);
          }
          return mainAgentProfilePromise;
        }

        async function fetchStatus(button) {
          try {
            button.dataset.lastChecked = String(Date.now());
            const response = await fetch("/api/config/file");
            const status = await response.json();
            button.dataset.configPath = status.path || "";
            if (status.exists) {
              button.disabled = true;
              button.textContent = "配置文件已存在";
              button.title = status.path || "配置文件已存在";
            } else {
              button.disabled = false;
              button.textContent = "新建配置文件";
              button.title = status.path ? `创建 ${status.path}` : "创建配置文件";
            }
          } catch (error) {
            button.disabled = true;
            button.textContent = "配置状态不可用";
            button.title = error && error.message ? error.message : "配置状态不可用";
          }
        }

        async function createConfigFile(button) {
          button.disabled = true;
          button.textContent = "创建中...";
          try {
            const response = await fetch("/api/config/file", { method: "POST" });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(result.error || "创建配置文件失败");
            }
            button.textContent = "配置文件已创建";
            button.title = result.path || button.dataset.configPath || "";
            alert(`配置文件已创建：\n${result.path || ""}`);
          } catch (error) {
            alert(error && error.message ? error.message : "创建配置文件失败");
            await fetchStatus(button);
          }
        }

        function inputValue(form, name) {
          const value = new FormData(form).get(name);
          return typeof value === "string" ? value.trim() : "";
        }

        function numberValue(form, name) {
          const value = inputValue(form, name);
          return value === "" ? undefined : Number(value);
        }

        async function openMainAgentConfigModal() {
          const oldModal = document.getElementById(MAIN_AGENT_MODAL_ID);
          if (oldModal) {
            oldModal.remove();
          }

          let profile;
          try {
            const response = await fetch("/api/agents/main%3Aassistant");
            if (!response.ok) {
              throw new Error("主智能体配置不可用");
            }
            profile = await response.json();
          } catch (error) {
            alert(error && error.message ? error.message : "主智能体配置不可用");
            return;
          }

          const modelConfig = profile.modelConfig || {};
          const modal = document.createElement("div");
          modal.id = MAIN_AGENT_MODAL_ID;
          modal.className = "fixed inset-0 z-[9999] bg-black/60 flex items-center justify-center p-4";
          modal.innerHTML = `
            <div class="glass-panel p-6 rounded-lg border border-outline-variant/20 w-[min(720px,calc(100vw-2rem))] max-h-[90vh] overflow-y-auto">
              <div class="flex items-center justify-between gap-4 mb-5">
                <div>
                  <h2 class="text-lg font-bold text-on-surface font-headline">配置主智能体</h2>
                  <p class="text-sm text-on-surface-variant mt-1">保存后会立即热重载 Spring AI client。</p>
                </div>
                <button type="button" data-close class="px-3 py-2 rounded bg-surface-container-high text-on-surface hover:bg-surface-container-highest">关闭</button>
              </div>
              <form data-form class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <label class="block text-sm text-on-surface-variant">
                    Provider
                    <input name="provider" value="${escapeHtml(modelConfig.provider || "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                  <label class="block text-sm text-on-surface-variant">
                    Model
                    <input name="model" value="${escapeHtml(modelConfig.model || "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                </div>
                <label class="block text-sm text-on-surface-variant">
                  API Base
                  <input name="apiBase" value="${escapeHtml(modelConfig.apiBase || "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                </label>
                <label class="flex items-start gap-3 rounded border border-outline-variant/20 bg-surface-container-low px-4 py-3 text-sm text-on-surface-variant">
                  <input name="streaming" type="checkbox" ${modelConfig.streaming === false ? "" : "checked"} class="mt-1 h-4 w-4 accent-secondary" />
                  <span>
                    <span class="block text-on-surface">启用流式响应</span>
                    <span class="block text-xs mt-1">vLLM 或 OpenAI-compatible 聚合接口触发 Spring AI 流式聚合错误时，可关闭。</span>
                  </span>
                </label>
                <label class="block text-sm text-on-surface-variant">
                  思考模式
                  <select name="thinkingMode" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40">
                    <option value="auto" ${(modelConfig.thinkingMode || "auto") === "auto" ? "selected" : ""}>自动（跟随服务端）</option>
                    <option value="disabled" ${modelConfig.thinkingMode === "disabled" ? "selected" : ""}>关闭</option>
                    <option value="enabled" ${modelConfig.thinkingMode === "enabled" ? "selected" : ""}>开启</option>
                  </select>
                </label>
                <label class="block text-sm text-on-surface-variant">
                  思考强度
                  <select name="reasoningEffort" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40">
                    <option value="auto" ${(modelConfig.reasoningEffort || "auto") === "auto" ? "selected" : ""}>自动（不发送）</option>
                    <option value="minimal" ${modelConfig.reasoningEffort === "minimal" ? "selected" : ""}>极低</option>
                    <option value="low" ${modelConfig.reasoningEffort === "low" ? "selected" : ""}>低</option>
                    <option value="medium" ${modelConfig.reasoningEffort === "medium" ? "selected" : ""}>中</option>
                    <option value="high" ${modelConfig.reasoningEffort === "high" ? "selected" : ""}>高</option>
                    <option value="xhigh" ${modelConfig.reasoningEffort === "xhigh" ? "selected" : ""}>很高</option>
                    <option value="max" ${modelConfig.reasoningEffort === "max" ? "selected" : ""}>最高</option>
                  </select>
                  <span class="block text-xs mt-1">向支持的 OpenAI-compatible 接口发送 reasoning.effort。</span>
                </label>
                <label class="block text-sm text-on-surface-variant">
                  思考 Token 预算（vLLM）
                  <input name="thinkingTokenBudget" type="number" min="0" step="1" value="${escapeHtml(modelConfig.thinkingTokenBudget ?? 0)}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  <span class="block text-xs mt-1">0 表示不发送；显式设置思考强度时，以思考强度为准。</span>
                </label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <label class="block text-sm text-on-surface-variant">
                    Temperature
                    <input name="temperature" type="number" step="0.01" value="${escapeHtml(modelConfig.temperature ?? "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                  <label class="block text-sm text-on-surface-variant">
                    Max Tokens
                    <input name="maxTokens" type="number" step="1" value="${escapeHtml(modelConfig.maxTokens ?? "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                  <label class="block text-sm text-on-surface-variant">
                    Tool Timeout Seconds
                    <input name="toolCallTimeoutSeconds" type="number" step="1" value="${escapeHtml(modelConfig.toolCallTimeoutSeconds ?? "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <label class="block text-sm text-on-surface-variant">
                    Child Agent Timeout Ms
                    <input name="childAgentTimeoutMs" type="number" step="1" value="${escapeHtml(modelConfig.childAgentTimeoutMs ?? "")}" class="mt-2 w-full bg-surface-container-high px-4 py-2 rounded text-on-surface outline-none focus:ring-2 focus:ring-secondary/40" />
                  </label>
                </div>
                <div data-error class="hidden text-sm text-red-300"></div>
                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" data-close class="px-4 py-2 rounded bg-surface-container-high text-on-surface hover:bg-surface-container-highest">取消</button>
                  <button type="submit" class="px-4 py-2 rounded bg-secondary text-on-secondary hover:opacity-90">保存并热重载</button>
                </div>
              </form>
            </div>
          `;

          modal.querySelectorAll("[data-close]").forEach(node => {
            node.addEventListener("click", () => modal.remove());
          });
          modal.addEventListener("click", event => {
            if (event.target === modal) {
              modal.remove();
            }
          });
          modal.querySelector("[data-form]").addEventListener("submit", async event => {
            event.preventDefault();
            const form = event.currentTarget;
            const error = modal.querySelector("[data-error]");
            const submit = form.querySelector("button[type='submit']");
            error.classList.add("hidden");
            submit.disabled = true;
            submit.textContent = "保存中...";
            try {
              const payload = {
                displayName: "主智能体",
                modelConfig: {
                  provider: inputValue(form, "provider") || undefined,
                  model: inputValue(form, "model") || undefined,
                  apiBase: inputValue(form, "apiBase") || undefined,
                  streaming: Boolean(form.elements.streaming && form.elements.streaming.checked),
                  thinkingMode: inputValue(form, "thinkingMode") || "auto",
                  reasoningEffort: inputValue(form, "reasoningEffort") || "auto",
                  thinkingTokenBudget: numberValue(form, "thinkingTokenBudget"),
                  temperature: numberValue(form, "temperature"),
                  maxTokens: numberValue(form, "maxTokens"),
                  toolCallTimeoutSeconds: numberValue(form, "toolCallTimeoutSeconds"),
                  childAgentTimeoutMs: numberValue(form, "childAgentTimeoutMs")
                }
              };
              Object.keys(payload.modelConfig).forEach(key => {
                if (payload.modelConfig[key] === undefined || Number.isNaN(payload.modelConfig[key])) {
                  delete payload.modelConfig[key];
                }
              });
              const response = await fetch("/api/agents/main%3Aassistant", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) {
                throw new Error(result.error || "保存主智能体配置失败");
              }
              modal.remove();
              alert(result.clientReloaded === false
                ? `配置已保存，但热重载失败：${result.reloadError || ""}`
                : "主智能体配置已保存并热重载");
              location.reload();
            } catch (saveError) {
              error.textContent = saveError && saveError.message ? saveError.message : "保存主智能体配置失败";
              error.classList.remove("hidden");
            } finally {
              submit.disabled = false;
              submit.textContent = "保存并热重载";
            }
          });
          document.body.appendChild(modal);
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function ensureDatalist(id, values) {
          let datalist = document.getElementById(id);
          if (!datalist) {
            datalist = document.createElement("datalist");
            datalist.id = id;
            document.body.appendChild(datalist);
          }
          datalist.innerHTML = values
            .filter(Boolean)
            .map(value => `<option value="${escapeHtml(value)}"></option>`)
            .join("");
          return datalist;
        }

        function inputAfterLabel(labelText) {
          const labels = Array.from(document.querySelectorAll("label"));
          const label = labels.find(node => (node.textContent || "").trim().startsWith(labelText));
          if (!label) {
            return null;
          }
          const wrapped = label.querySelector("input,textarea");
          if (wrapped) {
            return wrapped;
          }
          return label.parentElement ? label.parentElement.querySelector("input,textarea") : null;
        }

        function selectedAgentLooksMain() {
          return Array.from(document.querySelectorAll("span"))
            .some(node => (node.textContent || "").trim() === "MAIN_AGENT");
        }

        async function enhanceAgentEditModal() {
          if (location.pathname !== "/agents") {
            return;
          }
          const providerInput = inputAfterLabel("Provider");
          const modelInput = inputAfterLabel("Model");
          const apiBaseInput = inputAfterLabel("API Base");
          if (!providerInput || !modelInput || !apiBaseInput) {
            return;
          }

          const [providers, models, mainProfile] = await Promise.all([
            loadProviderOptions(),
            loadModelOptions(),
            loadMainAgentProfile()
          ]);
          if (providerInput.dataset.jobclawEnhanced === "true") {
            return;
          }
          providerInput.dataset.jobclawEnhanced = "true";

          const providerSelect = createSelectFromInput(
            providerInput,
            "jobclaw-main-provider-select",
            providers.map(provider => provider.name),
            "选择 Provider"
          );
          const modelSelect = createSelectFromInput(
            modelInput,
            "jobclaw-main-model-select",
            modelValuesForProvider(models, providerSelect.value, modelInput.value),
            "选择 Model"
          );
          const apiKeyInput = ensureMainAgentApiKeyInput(apiBaseInput);
          const streamingInput = ensureMainAgentStreamingInput(apiBaseInput);
          const thinkingModeInput = ensureMainAgentThinkingModeInput(
            apiBaseInput,
            mainProfile && mainProfile.modelConfig ? mainProfile.modelConfig.thinkingMode : "auto"
          );
          const reasoningEffortInput = ensureMainAgentReasoningEffortInput(
            apiBaseInput,
            mainProfile && mainProfile.modelConfig ? mainProfile.modelConfig.reasoningEffort : "auto"
          );
          const thinkingTokenBudgetInput = ensureMainAgentThinkingTokenBudgetInput(
            apiBaseInput,
            mainProfile && mainProfile.modelConfig ? mainProfile.modelConfig.thinkingTokenBudget : 0
          );

          function refreshProviderDerivedFields() {
            const selectedProvider = providers.find(provider => provider.name === providerSelect.value);
            if (selectedProvider && selectedProvider.apiBase) {
              syncInputValue(apiBaseInput, selectedProvider.apiBase);
            }
            if (apiKeyInput && selectedAgentLooksMain()) {
              apiKeyInput.value = "";
              apiKeyInput.placeholder = selectedProvider && selectedProvider.apiKey
                ? `当前：${selectedProvider.apiKey}，留空不修改`
                : "留空则不修改已有 API Key";
            }
            if (streamingInput && selectedAgentLooksMain()) {
              streamingInput.checked = !selectedProvider || selectedProvider.streaming !== false;
            }
            updateSelectOptions(
              modelSelect,
              modelValuesForProvider(models, providerSelect.value, modelInput.value),
              "选择 Model",
              modelInput.value
            );
            if (providerSelect.value) {
              const modelStillMatchesProvider = models.some(model =>
                model.provider === providerSelect.value
                  && ((model.name || model.model) === modelSelect.value || model.model === modelSelect.value));
              if (!modelStillMatchesProvider) {
                syncInputValue(modelInput, "");
                modelSelect.value = "";
              }
            }
          }

          providerSelect.addEventListener("change", () => {
            syncInputValue(providerInput, providerSelect.value);
            refreshProviderDerivedFields();
          });

          modelSelect.addEventListener("change", () => {
            const selected = models.find(model => model.name === modelSelect.value || model.model === modelSelect.value);
            if (!selected) {
              syncInputValue(modelInput, modelSelect.value);
              return;
            }
            syncInputValue(modelInput, selected.name || selected.model);
            if (selected.provider && providerSelect.value !== selected.provider) {
              providerSelect.value = selected.provider;
              syncInputValue(providerInput, selected.provider);
              refreshProviderDerivedFields();
            }
          });

          refreshProviderDerivedFields();
        }

        function ensureMainAgentApiKeyInput(apiBaseInput) {
          const existing = document.getElementById("jobclaw-main-agent-api-key");
          if (existing) {
            return existing;
          }
          const apiBaseContainer = apiBaseInput.parentElement;
          if (!apiBaseContainer) {
            return null;
          }
          const wrapper = document.createElement("div");
          wrapper.className = apiBaseContainer.className || "";
          wrapper.innerHTML = `
            <label class="block text-sm text-on-surface-variant mb-2">API Key</label>
            <input id="jobclaw-main-agent-api-key" type="password" autocomplete="off" placeholder="留空则不修改已有 API Key" class="${escapeHtml(apiBaseInput.className || "")}" />
          `;
          apiBaseContainer.parentElement.insertBefore(wrapper, apiBaseContainer.nextSibling);
          return document.getElementById("jobclaw-main-agent-api-key");
        }

        function ensureMainAgentStreamingInput(apiBaseInput) {
          const existing = document.getElementById("jobclaw-main-agent-streaming")
            || document.querySelector(`#${MAIN_AGENT_MODAL_ID} [name="streaming"]`);
          if (existing) {
            return existing;
          }
          const apiBaseContainer = apiBaseInput.parentElement;
          if (!apiBaseContainer || !apiBaseContainer.parentElement) {
            return null;
          }
          const wrapper = document.createElement("div");
          wrapper.className = apiBaseContainer.className || "";
          wrapper.innerHTML = `
            <label class="flex items-start gap-3 rounded border border-outline-variant/20 bg-surface-container-low px-4 py-3 text-sm text-on-surface-variant">
              <input id="jobclaw-main-agent-streaming" type="checkbox" checked class="mt-1 h-4 w-4 accent-secondary" />
              <span>
                <span class="block text-on-surface">启用流式响应</span>
                <span class="block text-xs mt-1">vLLM 或 OpenAI-compatible 聚合接口异常时可关闭。</span>
              </span>
            </label>
          `;
          const apiKey = document.getElementById("jobclaw-main-agent-api-key");
          const anchor = apiKey && apiKey.closest("div") ? apiKey.closest("div") : apiBaseContainer;
          anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);
          return document.getElementById("jobclaw-main-agent-streaming");
        }

        function ensureMainAgentThinkingModeInput(apiBaseInput, currentMode) {
          const existing = document.getElementById("jobclaw-main-agent-thinking-mode")
            || document.querySelector(`#${MAIN_AGENT_MODAL_ID} [name="thinkingMode"]`);
          if (existing) {
            return existing;
          }
          const apiBaseContainer = apiBaseInput.parentElement;
          if (!apiBaseContainer || !apiBaseContainer.parentElement) {
            return null;
          }
          const wrapper = document.createElement("div");
          wrapper.className = apiBaseContainer.className || "";
          wrapper.innerHTML = `
            <label class="block text-sm text-on-surface-variant mb-2">思考模式</label>
            <select id="jobclaw-main-agent-thinking-mode" class="${escapeHtml(apiBaseInput.className || "")}">
              <option value="auto">自动（跟随服务端）</option>
              <option value="disabled">关闭</option>
              <option value="enabled">开启</option>
            </select>
          `;
          const streaming = document.getElementById("jobclaw-main-agent-streaming");
          const anchor = streaming && streaming.closest("div") ? streaming.closest("div") : apiBaseContainer;
          anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);
          const select = document.getElementById("jobclaw-main-agent-thinking-mode");
          select.value = ["auto", "disabled", "enabled"].includes(currentMode) ? currentMode : "auto";
          return select;
        }

        function ensureMainAgentThinkingTokenBudgetInput(apiBaseInput, currentBudget) {
          const existing = document.getElementById("jobclaw-main-agent-thinking-token-budget")
            || document.querySelector(`#${MAIN_AGENT_MODAL_ID} [name="thinkingTokenBudget"]`);
          if (existing) {
            return existing;
          }
          const apiBaseContainer = apiBaseInput.parentElement;
          if (!apiBaseContainer || !apiBaseContainer.parentElement) {
            return null;
          }
          const wrapper = document.createElement("div");
          wrapper.className = apiBaseContainer.className || "";
          wrapper.innerHTML = `
            <label class="block text-sm text-on-surface-variant mb-2">思考 Token 预算（vLLM）</label>
            <input id="jobclaw-main-agent-thinking-token-budget" type="number" min="0" step="1" value="${escapeHtml(currentBudget ?? 0)}" class="${escapeHtml(apiBaseInput.className || "")}" />
            <div class="text-xs text-on-surface-variant mt-1">0 表示不发送；显式设置思考强度时，以思考强度为准。</div>
          `;
          const reasoningEffort = document.getElementById("jobclaw-main-agent-reasoning-effort");
          const anchor = reasoningEffort && reasoningEffort.closest("div") ? reasoningEffort.closest("div") : apiBaseContainer;
          anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);
          return document.getElementById("jobclaw-main-agent-thinking-token-budget");
        }

        function ensureMainAgentReasoningEffortInput(apiBaseInput, currentEffort) {
          const existing = document.getElementById("jobclaw-main-agent-reasoning-effort")
            || document.querySelector(`#${MAIN_AGENT_MODAL_ID} [name="reasoningEffort"]`);
          if (existing) {
            return existing;
          }
          const apiBaseContainer = apiBaseInput.parentElement;
          if (!apiBaseContainer || !apiBaseContainer.parentElement) {
            return null;
          }
          const wrapper = document.createElement("div");
          wrapper.className = apiBaseContainer.className || "";
          wrapper.innerHTML = `
            <label class="block text-sm text-on-surface-variant mb-2">思考强度</label>
            <select id="jobclaw-main-agent-reasoning-effort" class="${escapeHtml(apiBaseInput.className || "")}">
              <option value="auto">自动（不发送）</option>
              <option value="minimal">极低</option>
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
              <option value="xhigh">很高</option>
              <option value="max">最高</option>
            </select>
            <div class="text-xs text-on-surface-variant mt-1">向支持的 OpenAI-compatible 接口发送 reasoning.effort。</div>
          `;
          const thinkingMode = document.getElementById("jobclaw-main-agent-thinking-mode");
          const anchor = thinkingMode && thinkingMode.closest("div") ? thinkingMode.closest("div") : apiBaseContainer;
          anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);
          const select = document.getElementById("jobclaw-main-agent-reasoning-effort");
          const allowed = ["auto", "minimal", "low", "medium", "high", "xhigh", "max"];
          select.value = allowed.includes(currentEffort) ? currentEffort : "auto";
          return select;
        }

        function modelValuesForProvider(models, provider, currentValue) {
          const filtered = provider
            ? models.filter(model => model.provider === provider)
            : models;
          return Array.from(new Set([currentValue, ...filtered.map(model => model.name || model.model)].filter(Boolean)));
        }

        function updateSelectOptions(select, options, placeholder, selectedValue) {
          const values = Array.from(new Set([selectedValue, ...options].filter(Boolean)));
          select.innerHTML = [
            `<option value="">${escapeHtml(placeholder)}</option>`,
            ...values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
          ].join("");
          select.value = selectedValue && values.includes(selectedValue) ? selectedValue : "";
        }

        function createSelectFromInput(input, id, options, placeholder) {
          let select = document.getElementById(id);
          if (!select) {
            select = document.createElement("select");
            select.id = id;
            select.className = input.className;
            input.parentElement.insertBefore(select, input);
            input.type = "hidden";
            input.classList.add("hidden");
            select.addEventListener("change", () => syncInputValue(input, select.value));
          }

          const values = Array.from(new Set([input.value, ...options].filter(Boolean)));
          updateSelectOptions(select, values, placeholder, input.value || "");
          return select;
        }

        function syncInputValue(input, value) {
          input.value = value;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        }

        function capabilityChatSuggestions() {
          return [
            "检查当前项目能否正常打包，并汇总失败原因",
            "帮我梳理当前工作区最近修改，形成下一步待办",
            "读取 workspace 里的资料，整理一份结构化摘要",
            "检查最近一次任务有没有遗漏的文件产物或收尾动作",
            "根据当前项目代码，找出最值得优先修复的风险点",
            "帮我设计一个可执行的测试场景，并运行验证",
            "整理当前智能体配置和可用工具，说明适合做哪些任务",
            "分析一个文件夹里的文档，并生成报告或表格"
          ];
        }

        function mixChatSuggestions(recentPrompts) {
          const recent = Array.from(new Set((recentPrompts || []).filter(Boolean))).slice(0, 1);
          const abilities = capabilityChatSuggestions()
            .filter(item => !recent.includes(item))
            .sort(() => Math.random() - 0.5);
          return [...recent, ...abilities].slice(0, 2);
        }

        function normalizePrompt(value) {
          const text = String(value || "")
            .replace(/\s+/g, " ")
            .replace(/^用户[:：]\s*/, "")
            .trim();
          if (!text || text.length < 4) {
            return "";
          }
          if (/^(ok|yes|no|好|嗯|继续|可以|收到)$/i.test(text)) {
            return "";
          }
          return text.length > 72 ? `${text.slice(0, 72)}...` : text;
        }

        function collectPromptCandidates(value, output, seen) {
          if (!value || output.length >= 6) {
            return;
          }
          if (Array.isArray(value)) {
            value.forEach(item => collectPromptCandidates(item, output, seen));
            return;
          }
          if (typeof value !== "object") {
            return;
          }

          const role = String(value.role || value.sender || value.type || value.messageType || "").toLowerCase();
          const isUserMessage = role === "user" || role === "human" || role === "request" || role === "user_message";
          if (isUserMessage) {
            const text = normalizePrompt(value.content || value.message || value.text || value.body || value.prompt);
            if (text && !seen.has(text)) {
              seen.add(text);
              output.push(text);
            }
          }

          ["messages", "history", "entries", "conversation", "turns", "items"].forEach(key => {
            if (value[key]) {
              collectPromptCandidates(value[key], output, seen);
            }
          });
        }

        async function loadChatSuggestions() {
          if (chatSuggestionsPromise) {
            return chatSuggestionsPromise;
          }
          chatSuggestionsPromise = (async () => {
            try {
              const response = await fetch("/api/sessions?channel=web&page=1&size=8");
              if (!response.ok) {
                return mixChatSuggestions([]);
              }
              const payload = await response.json();
              const sessions = Array.isArray(payload)
                ? payload
                : Array.isArray(payload.items)
                  ? payload.items
                  : Array.isArray(payload.content)
                    ? payload.content
                    : [];
              const prompts = [];
              const seen = new Set();
              for (const session of sessions) {
                const key = session && (session.key || session.sessionKey || session.id);
                if (!key || prompts.length >= 4) {
                  continue;
                }
                try {
                  const detailResponse = await fetch(`/api/sessions/${encodeURIComponent(key)}`);
                  if (detailResponse.ok) {
                    collectPromptCandidates(await detailResponse.json(), prompts, seen);
                  }
                } catch (ignored) {
                  // Recent prompts are a convenience only.
                }
              }
              return mixChatSuggestions(prompts);
            } catch (ignored) {
              return mixChatSuggestions([]);
            }
          })();
          return chatSuggestionsPromise;
        }

        function findChatTextarea() {
          if (location.pathname !== "/chat") {
            return null;
          }
          const textareas = Array.from(document.querySelectorAll("textarea"));
          return textareas.find(node => !node.disabled && node.offsetParent !== null) || textareas[0] || null;
        }

        function currentChatSessionKey() {
          return localStorage.getItem("jobclaw:chat:currentSessionKey") || "new";
        }

        function currentChatReasoningEffort() {
          try {
            return localStorage.getItem(CHAT_REASONING_EFFORT_STORAGE_PREFIX + currentChatSessionKey()) || "";
          } catch (ignored) {
            return "";
          }
        }

        function ensureChatReasoningEffortControl() {
          const existing = document.getElementById(CHAT_REASONING_EFFORT_ID);
          const textarea = findChatTextarea();
          if (!textarea) {
            if (existing) {
              existing.remove();
            }
            return;
          }
          const inputPanel = textarea.closest(".border-t") || textarea.closest("div[class*='border-t']");
          if (!inputPanel) {
            return;
          }
          const controls = inputPanel.querySelector("#jobclaw-chat-controls");
          const sessionKey = currentChatSessionKey();
          if (existing && controls && controls.contains(existing)) {
            const select = existing.querySelector("select");
            if (select && existing.dataset.sessionKey !== sessionKey) {
              existing.dataset.sessionKey = sessionKey;
              select.value = currentChatReasoningEffort();
            }
            return;
          }
          if (existing) {
            existing.remove();
          }

          const control = document.createElement("div");
          control.id = CHAT_REASONING_EFFORT_ID;
          control.dataset.sessionKey = sessionKey;
          control.className = "flex min-h-8 items-center gap-2 text-xs text-on-surface-variant";
          control.title = "从下一条消息开始生效，只覆盖当前对话，不修改智能体配置";
          control.innerHTML = `
            <label for="jobclaw-chat-reasoning-effort-select">思考强度</label>
            <select id="jobclaw-chat-reasoning-effort-select" class="rounded border border-outline-variant/30 bg-surface-container-high px-2 py-1 text-xs text-on-surface outline-none focus:ring-2 focus:ring-secondary/40">
              <option value="">默认</option>
              <option value="minimal">极低</option>
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
              <option value="xhigh">很高</option>
              <option value="max">最高</option>
            </select>
          `;
          const select = control.querySelector("select");
          select.value = currentChatReasoningEffort();
          select.addEventListener("change", () => {
            try {
              const key = CHAT_REASONING_EFFORT_STORAGE_PREFIX + currentChatSessionKey();
              if (select.value) {
                localStorage.setItem(key, select.value);
              } else {
                localStorage.removeItem(key);
              }
              control.dataset.sessionKey = currentChatSessionKey();
            } catch (ignored) {
              // The request still uses the visible value when storage is unavailable.
            }
          });

          if (controls) {
            controls.appendChild(control);
          } else {
            let anchor = textarea;
            while (anchor.parentElement && anchor.parentElement !== inputPanel) {
              anchor = anchor.parentElement;
            }
            inputPanel.insertBefore(control, anchor.parentElement === inputPanel ? anchor : inputPanel.firstChild);
          }
        }

        function currentChatIsBlank() {
          try {
            const key = localStorage.getItem("jobclaw:chat:currentSessionKey");
            if (!key) {
              return true;
            }
            const raw = localStorage.getItem(`jobclaw:chat:messages:${key}`);
            if (!raw) {
              return true;
            }
            const messages = JSON.parse(raw);
            return !Array.isArray(messages) || messages.length === 0;
          } catch (ignored) {
            return true;
          }
        }

        function submitChatSuggestion(prompt) {
          const textarea = findChatTextarea();
          if (!textarea) {
            return;
          }
          syncInputValue(textarea, prompt);
          const inputPanel = textarea.closest(".border-t") || textarea.closest("div[class*='border-t']") || textarea.parentElement;
          const buttons = Array.from((inputPanel || document).querySelectorAll("button"));
          const send = buttons.find(button => (button.textContent || "").trim() === "发送" && !button.disabled);
          if (send) {
            send.click();
          }
        }

        async function ensureChatSuggestions() {
          const existing = document.getElementById(CHAT_SUGGESTIONS_ID);
          const textarea = findChatTextarea();
          if (!textarea || !currentChatIsBlank()) {
            if (existing) {
              existing.remove();
            }
            return;
          }
          const inputPanel = textarea.closest(".border-t") || textarea.closest("div[class*='border-t']");
          if (!inputPanel) {
            return;
          }
          if (existing && existing.parentElement === inputPanel.parentElement) {
            return;
          }
          if (existing) {
            existing.remove();
          }

          const panel = document.createElement("div");
          panel.id = CHAT_SUGGESTIONS_ID;
          panel.className = "mb-3 rounded-lg border border-outline-variant/20 bg-surface-container-high/70 px-3 py-2";
          panel.innerHTML = `
            <div class="flex items-center justify-between gap-3 mb-2">
              <div class="text-xs font-medium text-on-surface-variant">最近可以继续</div>
              <button type="button" data-refresh class="text-xs text-secondary hover:opacity-80">换一组</button>
            </div>
            <div data-items class="flex min-w-0 flex-nowrap gap-2 overflow-hidden">
              <span class="text-xs text-on-surface-variant/80">正在读取最近操作...</span>
            </div>
          `;
          inputPanel.parentElement.insertBefore(panel, inputPanel);

          const render = prompts => {
            const list = panel.querySelector("[data-items]");
            if (!list) {
              return;
            }
            list.innerHTML = "";
            prompts.forEach(prompt => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "min-w-0 rounded-md border border-outline-variant/20 bg-surface-container-low px-3 py-1.5 text-left text-xs text-on-surface hover:bg-surface-container-highest";
              button.style.flex = "1 1 0";
              button.style.overflow = "hidden";
              button.style.textOverflow = "ellipsis";
              button.style.whiteSpace = "nowrap";
              button.textContent = prompt;
              button.title = prompt;
              button.addEventListener("click", () => submitChatSuggestion(prompt));
              list.appendChild(button);
            });
          };

          panel.querySelector("[data-refresh]").addEventListener("click", async () => {
            chatSuggestionsPromise = null;
            render(await loadChatSuggestions());
          });
          render(await loadChatSuggestions());
        }

        const originalFetch = window.fetch;
        window.fetch = function (resource, init) {
          const url = typeof resource === "string" ? resource : resource && resource.url;
          const method = init && init.method ? String(init.method).toUpperCase() : "GET";
          let requestPath = "";
          try {
            requestPath = url ? new URL(url, location.href).pathname : "";
          } catch (ignored) {
            requestPath = "";
          }
          if (method === "POST" && requestPath === "/api/execute/stream" && init && init.body) {
            const selector = document.querySelector(`#${CHAT_REASONING_EFFORT_ID} select`);
            const reasoningEffort = selector ? selector.value : currentChatReasoningEffort();
            if (init.body instanceof FormData) {
              if (reasoningEffort) {
                init.body.set("reasoningEffort", reasoningEffort);
              } else {
                init.body.delete("reasoningEffort");
              }
            } else if (typeof init.body === "string") {
              try {
                const body = JSON.parse(init.body);
                if (reasoningEffort) {
                  body.reasoningEffort = reasoningEffort;
                } else {
                  delete body.reasoningEffort;
                }
                init = { ...init, body: JSON.stringify(body) };
              } catch (ignored) {
                // Keep the original request body if it is not JSON.
              }
            }
          }
          if (method === "PUT" && url && url.includes("/api/agents/main%3Aassistant")) {
            const apiKeyInput = document.getElementById("jobclaw-main-agent-api-key");
            const apiKey = apiKeyInput && apiKeyInput.value ? apiKeyInput.value.trim() : "";
            const streamingInput = document.getElementById("jobclaw-main-agent-streaming");
            const thinkingModeInput = document.getElementById("jobclaw-main-agent-thinking-mode");
            const reasoningEffortInput = document.getElementById("jobclaw-main-agent-reasoning-effort");
            const thinkingTokenBudgetInput = document.getElementById("jobclaw-main-agent-thinking-token-budget");
            if (init && init.body && typeof init.body === "string") {
              try {
                const body = JSON.parse(init.body);
                body.modelConfig = body.modelConfig || {};
                if (apiKey) {
                  body.modelConfig.apiKey = apiKey;
                }
                if (streamingInput) {
                  body.modelConfig.streaming = streamingInput.checked;
                }
                if (thinkingModeInput) {
                  body.modelConfig.thinkingMode = thinkingModeInput.value || "auto";
                }
                if (reasoningEffortInput) {
                  body.modelConfig.reasoningEffort = reasoningEffortInput.value || "auto";
                }
                if (thinkingTokenBudgetInput) {
                  body.modelConfig.thinkingTokenBudget = Number(thinkingTokenBudgetInput.value || 0);
                }
                init = { ...init, body: JSON.stringify(body) };
              } catch (ignored) {
                // Keep the original request body if it is not JSON.
              }
            }
          }
          return originalFetch.call(this, resource, init);
        };

        const originalXhrOpen = XMLHttpRequest.prototype.open;
        const originalXhrSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          this.__jobclawMethod = method ? String(method).toUpperCase() : "";
          this.__jobclawUrl = url ? String(url) : "";
          return originalXhrOpen.call(this, method, url, ...rest);
        };
        XMLHttpRequest.prototype.send = function (body) {
          if (this.__jobclawMethod === "PUT" && this.__jobclawUrl.includes("/api/agents/main%3Aassistant")) {
            const apiKeyInput = document.getElementById("jobclaw-main-agent-api-key");
            const apiKey = apiKeyInput && apiKeyInput.value ? apiKeyInput.value.trim() : "";
            const streamingInput = document.getElementById("jobclaw-main-agent-streaming");
            const thinkingModeInput = document.getElementById("jobclaw-main-agent-thinking-mode");
            const reasoningEffortInput = document.getElementById("jobclaw-main-agent-reasoning-effort");
            const thinkingTokenBudgetInput = document.getElementById("jobclaw-main-agent-thinking-token-budget");
            if (typeof body === "string") {
              try {
                const parsed = JSON.parse(body);
                parsed.modelConfig = parsed.modelConfig || {};
                if (apiKey) {
                  parsed.modelConfig.apiKey = apiKey;
                }
                if (streamingInput) {
                  parsed.modelConfig.streaming = streamingInput.checked;
                }
                if (thinkingModeInput) {
                  parsed.modelConfig.thinkingMode = thinkingModeInput.value || "auto";
                }
                if (reasoningEffortInput) {
                  parsed.modelConfig.reasoningEffort = reasoningEffortInput.value || "auto";
                }
                if (thinkingTokenBudgetInput) {
                  parsed.modelConfig.thinkingTokenBudget = Number(thinkingTokenBudgetInput.value || 0);
                }
                body = JSON.stringify(parsed);
              } catch (ignored) {
                // Keep the original request body if it is not JSON.
              }
            }
          }
          return originalXhrSend.call(this, body);
        };

        function findAgentsHeader() {
          if (location.pathname !== "/agents") {
            return null;
          }
          const headings = Array.from(document.querySelectorAll("h1"));
          const heading = headings.find(node => node.textContent && node.textContent.trim() === "智能体");
          return heading ? heading.closest(".flex.items-center.justify-between") : null;
        }

        function patchAgentsCopy() {
          if (location.pathname !== "/agents") {
            return;
          }
          Array.from(document.querySelectorAll("p")).forEach(node => {
            const text = node.textContent || "";
            if (text.includes("主智能体只读")) {
              node.textContent = " 管理智能体配置。主智能体可在此页配置；系统角色和用户智能体都可编辑；用户智能体可删除。 ";
            }
          });
        }

        function ensureButton() {
          patchAgentsCopy();
          enhanceAgentEditModal();
          const existing = document.getElementById(ID);
          const header = findAgentsHeader();
          if (!header) {
            if (existing) {
              existing.remove();
            }
            const mainAgentButton = document.getElementById(MAIN_AGENT_BUTTON_ID);
            if (mainAgentButton) {
              mainAgentButton.remove();
            }
            return;
          }
          if (existing && header.contains(existing)) {
            const now = Date.now();
            const lastChecked = Number(existing.dataset.lastChecked || "0");
            if (now - lastChecked > 5000) {
              fetchStatus(existing);
            }
            ensureMainAgentConfigButton(header);
            return;
          }
          if (existing) {
            existing.remove();
          }
          const button = document.createElement("button");
          button.id = ID;
          button.type = "button";
          button.className = "px-4 py-2 rounded bg-surface-container-high text-on-surface border border-outline-variant/30 hover:bg-surface-container-highest disabled:opacity-50 disabled:cursor-not-allowed transition-colors";
          button.textContent = "检查配置文件";
          button.addEventListener("click", () => createConfigFile(button));
          header.appendChild(button);
          fetchStatus(button);
          ensureMainAgentConfigButton(header);
        }

        function ensureMainAgentConfigButton(header) {
          if (!header) {
            return;
          }
          const existing = document.getElementById(MAIN_AGENT_BUTTON_ID);
          if (existing && header.contains(existing)) {
            return;
          }
          if (existing) {
            existing.remove();
          }
          const button = document.createElement("button");
          button.id = MAIN_AGENT_BUTTON_ID;
          button.type = "button";
          button.className = "px-4 py-2 rounded bg-secondary text-on-secondary hover:opacity-90 transition-colors";
          button.textContent = "配置主智能体";
          button.addEventListener("click", openMainAgentConfigModal);
          header.appendChild(button);
        }

        function ensureUiEnhancements() {
          ensureButton();
          ensureChatSuggestions();
          ensureChatReasoningEffortControl();
        }

        window.addEventListener("load", () => {
          const observer = new MutationObserver(ensureUiEnhancements);
          observer.observe(document.body, { childList: true, subtree: true });
          window.addEventListener("popstate", () => setTimeout(ensureUiEnhancements, 0));
          const originalPushState = history.pushState;
          history.pushState = function (...args) {
            const result = originalPushState.apply(this, args);
            setTimeout(ensureUiEnhancements, 0);
            return result;
          };
          setInterval(ensureUiEnhancements, 1000);
          setInterval(enhanceAgentEditModal, 500);
          ensureUiEnhancements();
        }, { once: true });
      })();
    </script>
  </body>
</html>
