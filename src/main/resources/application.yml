# JobClaw Application Configuration
spring:
  application:
    name: JobClaw
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  ai:
    tools:
      limits:
        # Long-running agent tasks are governed by cancellation, timeouts, and JobClaw's
        # stable-repeat guard instead of fixed per-turn tool call counts.
        max-calls-per-tool-default: -1
        max-total-tool-calls: -1
    openai:
      # 使用 DashScope Coding Plan 的 API Key（从 config.json 读取，这里是占位符）
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      # Spring AI 2 uses the OpenAI Java client, so keep the full OpenAI-compatible base URL.
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen3.5-plus}

# Server Configuration
server:
  port: 18791

# JobClaw Configuration
jobclaw:
  config-path: ~/.jobclaw/config.json
  workspace-path: ~/.jobclaw/workspace
  # 工具返回结果最大长度（字符数），默认 10000，避免超长输出
  max-tool-output-length: 10000

# Logging
logging:
  level:
    root: INFO
    io.jobclaw: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/jobclaw.log
